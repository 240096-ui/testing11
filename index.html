<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Testogram Supabase</title>

<style>
body { font-family: Inter, sans-serif; background:#eee; margin:0; }
.container { max-width:900px; margin:20px auto; background:#fff; padding:20px; border-radius:10px; }
.user-item { display:flex; gap:10px; padding:10px; border-bottom:1px solid #ddd; cursor:pointer; }
.msg { padding:8px 12px; margin:5px 0; background:#f2f2f2; border-radius:8px; max-width:70%; }
.msg-me { background:#cce5ff; margin-left:auto; }
#chatBox { height:300px; overflow:auto; border:1px solid #ddd; padding:10px; }
button { padding:8px 12px; cursor:pointer; }
</style>
</head>

<body>

<div class="container">
  <button onclick="login()">Login Google</button>
  <button onclick="logout()">Logout</button>

  <h3>Users</h3>
  <div id="userList"></div>

  <h3>Chat</h3>
  <div id="chatBox"></div>

  <input id="chatInput" placeholder="message">
  <button onclick="sendMessage()">Send</button>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://ieornhttkehqvfrllcqq.supabase.co",
  "sb_publishable_jIDA-yATtMRGuQaO0JgomA_vkOaoszh"
);

let currentUser = null;
let activeUser = null;

// ---------- AUTH ----------
window.login = async () => {
  await supabase.auth.signInWithOAuth({ provider: "google" });
};

window.logout = async () => {
  await supabase.auth.signOut();
  location.reload();
};

supabase.auth.onAuthStateChange((_, session) => {
  if (session) {
    currentUser = session.user;
    loadUsers();
  }
});

// ---------- USERS ----------
async function loadUsers() {
  const { data } = await supabase.from("profiles").select("*");

  const list = document.getElementById("userList");
  list.innerHTML = "";

  data.forEach(u => {
    if (u.id === currentUser.id) return;

    const div = document.createElement("div");
    div.className = "user-item";
    div.innerText = u.username || u.id;

    div.onclick = () => openChat(u);
    list.appendChild(div);
  });
}

// ---------- CHAT ID ----------
function chatId(a, b) {
  return [a, b].sort().join("_");
}

// ---------- OPEN CHAT ----------
async function openChat(user) {
  activeUser = user;

  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("chat_id", chatId(currentUser.id, user.id))
    .order("created_at");

  renderChat(data || []);

  supabase
    .channel("chat")
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "messages"
    }, payload => {
      if (payload.new.chat_id === chatId(currentUser.id, user.id)) {
        openChat(user);
      }
    })
    .subscribe();
}

// ---------- SEND ----------
window.sendMessage = async () => {
  const input = document.getElementById("chatInput");
  if (!input.value || !activeUser) return;

  await supabase.from("messages").insert({
    chat_id: chatId(currentUser.id, activeUser.id),
    from: currentUser.id,
    text: input.value
  });

  input.value = "";
};

// ---------- RENDER ----------
function renderChat(msgs) {
  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  msgs.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + (m.from === currentUser.id ? "msg-me" : "");
    div.innerText = m.text;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
