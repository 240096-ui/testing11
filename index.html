<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testogram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0088cc;
            --primary-hover: #007ab8;
            --bg: #e5e5e5;
            --card: #ffffff;
            --text-main: #222222;
            --text-muted: #888888;
            --border: #d0d0d0;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        body.dark {
            --primary: #1e90ff;
            --bg: #121212;
            --card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .main-grid {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: block;
            object-fit: cover;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: rgba(0, 136, 204, 0.1);
        }

        .user-item.active {
            background: var(--primary);
            color: white;
        }

        .user-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .post-author {
            font-weight: 700;
            color: var(--primary);
        }

        .post-time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .post-content {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .post-image {
            max-width: 100%;
            border-radius: 8px;
            margin: 12px 0;
        }

        .reactions {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }

        .react-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .react-btn:hover {
            color: var(--primary);
        }

        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message-mine {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }

        .message-theirs {
            background: var(--card);
            border: 1px solid var(--border);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text-main);
            font-family: inherit;
            margin-bottom: 10px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-window {
            background: var(--card);
            padding: 28px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
        }

        .modal-window h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }

        .success-msg {
            color: #27ae60;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }

        .switch-link {
            text-align: center;
            margin-top: 16px;
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .close-btn {
            width: 100%;
            margin-top: 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <div class="logo">📱 Testogram</div>
        <div id="authSection">
            <div id="unauthButtons">
                <button id="loginBtn">Вход</button>
                <button id="registerBtn" style="background: transparent; border: 1px solid var(--border);">Регистрация</button>
            </div>
            <div id="authUserInfo" style="display: none; align-items: center; gap: 16px;">
                <span id="userNameNav"></span>
                <button id="logoutBtn">Выйти</button>
                <button id="themeToggleBtn">🌙</button>
            </div>
        </div>
    </div>
</div>

<div class="main-grid">
    <!-- Левая колонка -->
    <div>
        <div id="profileCard" class="card" style="display: none;">
            <img id="profileAvatar" class="profile-avatar" src="">
            <h3 id="profileName" style="text-align: center;"></h3>
            <p style="text-align: center; color: var(--text-muted); font-size: 12px;">Online</p>
        </div>

        <div class="card">
            <div class="card-title">💬 Собеседники</div>
            <div id="usersList">Загрузка...</div>
        </div>
    </div>

    <!-- Центр - лента -->
    <div>
        <div id="createPostCard" class="card" style="display: none;">
            <div class="card-title">✨ Создать пост</div>
            <input type="text" id="postText" placeholder="Что у вас нового?">
            <input type="text" id="postImage" placeholder="Ссылка на картинку (необязательно)">
            <button id="publishPostBtn">Опубликовать</button>
        </div>
        <div id="feed"></div>
    </div>

    <!-- Правая колонка - чат -->
    <div>
        <div id="chatCard" class="card" style="display: none;">
            <div class="card-title" id="chatTitle">Чат</div>
            <div id="chatMessagesList" class="chat-messages"></div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="chatInputMessage" placeholder="Сообщение...">
                <button id="sendChatMsgBtn" style="width: auto; padding: 12px;">📤</button>
            </div>
        </div>
        <div id="noChatCard" class="card" style="text-align: center; color: var(--text-muted);">
            👈 Выберите собеседника слева, чтобы начать чат
        </div>
    </div>
</div>

<!-- Модальное окно авторизации -->
<div id="authModal" class="modal-overlay">
    <div class="modal-window">
        <h2 id="modalTitle">Вход</h2>
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPassword" placeholder="Пароль (мин. 6 символов)">
        <div id="authMessage"></div>
        <button id="submitAuth">Войти</button>
        <div id="toggleAuthMode" class="switch-link">Нет аккаунта? Зарегистрироваться</div>
        <button id="closeModal" class="close-btn">Отмена</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Supabase настройки
    const SUPABASE_URL = "https://ieornhttkehqvfrllcqq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jIDA-yATtMRGuQaO0JgomA_vkOaoszh";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Глобальные переменные
    let currentUser = null;
    let activeChatUser = null;
    let chatChannel = null;
    let isLogin = true;

    // DOM элементы
    const modal = document.getElementById('authModal');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtn = document.getElementById('submitAuth');
    const toggleText = document.getElementById('toggleAuthMode');
    const authMessage = document.getElementById('authMessage');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const closeModalBtn = document.getElementById('closeModal');

    // ==================== МОДАЛЬНОЕ ОКНО ====================
    function openModal() {
        modal.style.display = 'flex';
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
        authMessage.innerHTML = '';
    }

    function closeModalWindow() {
        modal.style.display = 'none';
    }

    loginBtn.onclick = () => {
        isLogin = true;
        modalTitle.innerText = 'Вход';
        submitBtn.innerText = 'Войти';
        toggleText.innerText = 'Нет аккаунта? Зарегистрироваться';
        openModal();
    };

    registerBtn.onclick = () => {
        isLogin = false;
        modalTitle.innerText = 'Регистрация';
        submitBtn.innerText = 'Зарегистрироваться';
        toggleText.innerText = 'Уже есть аккаунт? Войти';
        openModal();
    };

    toggleText.onclick = () => {
        isLogin = !isLogin;
        if (isLogin) {
            modalTitle.innerText = 'Вход';
            submitBtn.innerText = 'Войти';
            toggleText.innerText = 'Нет аккаунта? Зарегистрироваться';
        } else {
            modalTitle.innerText = 'Регистрация';
            submitBtn.innerText = 'Зарегистрироваться';
            toggleText.innerText = 'Уже есть аккаунт? Войти';
        }
        authMessage.innerHTML = '';
    };

    closeModalBtn.onclick = closeModalWindow;

    // Нажатие вне модалки - закрыть
    modal.onclick = (e) => {
        if (e.target === modal) closeModalWindow();
    };

    // ==================== АВТОРИЗАЦИЯ ====================
    submitBtn.onclick = async () => {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;

        if (!email || !password) {
            authMessage.innerHTML = '<div class="error-msg">Заполните все поля</div>';
            return;
        }

        if (!isLogin && password.length < 6) {
            authMessage.innerHTML = '<div class="error-msg">Пароль должен быть минимум 6 символов</div>';
            return;
        }

        try {
            let result;
            if (isLogin) {
                result = await supabase.auth.signInWithPassword({ email, password });
            } else {
                result = await supabase.auth.signUp({ email, password });
            }

            if (result.error) throw result.error;

            if (!isLogin) {
                authMessage.innerHTML = '<div class="success-msg">✅ Регистрация успешна! Теперь войдите.</div>';
                setTimeout(() => {
                    isLogin = true;
                    modalTitle.innerText = 'Вход';
                    submitBtn.innerText = 'Войти';
                    toggleText.innerText = 'Нет аккаунта? Зарегистрироваться';
                    authMessage.innerHTML = '';
                    document.getElementById('authEmail').value = '';
                    document.getElementById('authPassword').value = '';
                }, 2000);
            } else {
                closeModalWindow();
            }
        } catch (err) {
            authMessage.innerHTML = `<div class="error-msg">${err.message}</div>`;
        }
    };

    logoutBtn.onclick = async () => {
        await supabase.auth.signOut();
        location.reload();
    };

    // ==================== ПОСЛЕ ВХОДА ====================
    async function initAfterLogin(user) {
        currentUser = user;
        const userName = user.email.split('@')[0];
        const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email}`;

        // Сохраняем в БД
        await supabase.from('users').upsert({
            uid: user.id,
            name: userName,
            email: user.email,
            photo: avatarUrl
        });

        // Меняем UI
        document.getElementById('unauthButtons').style.display = 'none';
        document.getElementById('authUserInfo').style.display = 'flex';
        document.getElementById('userNameNav').innerText = userName;
        document.getElementById('profileCard').style.display = 'block';
        document.getElementById('createPostCard').style.display = 'block';
        document.getElementById('profileName').innerText = userName;
        document.getElementById('profileAvatar').src = avatarUrl;

        await loadAllUsers();
        await loadAllPosts();
        subscribeToPosts();
    }

    // ==================== ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ ====================
    async function loadAllUsers() {
        const { data: users, error } = await supabase
            .from('users')
            .select('*')
            .neq('uid', currentUser?.id);

        const container = document.getElementById('usersList');
        if (error || !users || users.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">🤝 Нет других пользователей</div>';
            return;
        }

        container.innerHTML = '';
        users.forEach(user => {
            const div = document.createElement('div');
            div.className = 'user-item';
            if (activeChatUser?.uid === user.uid) div.classList.add('active');
            div.innerHTML = `
                <img class="user-avatar-small" src="${user.photo}">
                <span>${user.name}</span>
            `;
            div.onclick = () => startChatWithUser(user);
            container.appendChild(div);
        });
    }

    // ==================== ЧАТ ====================
    async function startChatWithUser(user) {
        activeChatUser = user;
        document.getElementById('noChatCard').style.display = 'none';
        document.getElementById('chatCard').style.display = 'block';
        document.getElementById('chatTitle').innerHTML = `💬 Чат с ${user.name}`;

        if (chatChannel) chatChannel.unsubscribe();

        const chatId = [currentUser.id, user.uid].sort().join('_');

        // Подписка на новые сообщения
        chatChannel = supabase
            .channel(`chat_${chatId}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `chat_id=eq.${chatId}`
            }, (payload) => {
                appendMessage(payload.new);
            })
            .subscribe();

        // Загрузка истории
        const { data: messages } = await supabase
            .from('messages')
            .select('*')
            .eq('chat_id', chatId)
            .order('timestamp', { ascending: true });

        const container = document.getElementById('chatMessagesList');
        container.innerHTML = '';
        messages?.forEach(m => appendMessage(m));

        loadAllUsers();
    }

    function appendMessage(msg) {
        const container = document.getElementById('chatMessagesList');
        const isMine = msg.from_uid === currentUser.id;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMine ? 'message-mine' : 'message-theirs'}`;
        msgDiv.textContent = msg.text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('sendChatMsgBtn').onclick = async () => {
        if (!activeChatUser) return;
        const input = document.getElementById('chatInputMessage');
        const text = input.value.trim();
        if (!text) return;

        const chatId = [currentUser.id, activeChatUser.uid].sort().join('_');
        await supabase.from('messages').insert({
            chat_id: chatId,
            from_uid: currentUser.id,
            from_name: currentUser.email.split('@')[0],
            text: text,
            timestamp: new Date().toISOString()
        });
        input.value = '';
    };

    // ==================== ПОСТЫ ====================
    async function loadAllPosts() {
        const { data: posts } = await supabase
            .from('posts')
            .select('*')
            .order('timestamp', { ascending: false });

        const feed = document.getElementById('feed');
        if (!posts || posts.length === 0) {
            feed.innerHTML = '<div class="card" style="text-align: center;">Нет постов. Напишите первый!</div>';
            return;
        }

        feed.innerHTML = '';
        posts.forEach(post => {
            const postDiv = document.createElement('div');
            postDiv.className = 'post';
            postDiv.innerHTML = `
                <div class="post-header">
                    <span class="post-author">${escapeHtml(post.name)}</span>
                    <span class="post-time">${new Date(post.timestamp).toLocaleString()}</span>
                </div>
                ${post.text ? `<div class="post-content">${escapeHtml(post.text)}</div>` : ''}
                ${post.image_url ? `<img class="post-image" src="${post.image_url}" onerror="this.style.display='none'">` : ''}
                <div class="reactions">
                    <button class="react-btn" onclick="window.addReaction('${post.id}', 'like')">👍 ${post.reactions?.like || 0}</button>
                    <button class="react-btn" onclick="window.addReaction('${post.id}', 'fire')">🔥 ${post.reactions?.fire || 0}</button>
                    <button class="react-btn" onclick="window.addReaction('${post.id}', 'laugh')">😂 ${post.reactions?.laugh || 0}</button>
                </div>
            `;
            feed.appendChild(postDiv);
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    window.addReaction = async (postId, type) => {
        const { data: post } = await supabase.from('posts').select('reactions').eq('id', postId).single();
        if (post) {
            const newReactions = { ...(post.reactions || {}) };
            newReactions[type] = (newReactions[type] || 0) + 1;
            await supabase.from('posts').update({ reactions: newReactions }).eq('id', postId);
        }
    };

    function subscribeToPosts() {
        supabase.channel('posts_feed').on('postgres_changes', {
            event: '*', schema: 'public', table: 'posts'
        }, () => loadAllPosts()).subscribe();
    }

    document.getElementById('publishPostBtn').onclick = async () => {
        const text = document.getElementById('postText').value;
        const img = document.getElementById('postImage').value;
        if (!text && !img) {
            alert('Напишите текст или добавьте картинку');
            return;
        }
        await supabase.from('posts').insert({
            name: currentUser.email.split('@')[0],
            user_id: currentUser.id,
            text: text || '',
            image_url: img || '',
            timestamp: new Date().toISOString(),
            reactions: { like: 0, fire: 0, laugh: 0 }
        });
        document.getElementById('postText').value = '';
        document.getElementById('postImage').value = '';
    };

    // ==================== ТЕМА ====================
    document.getElementById('themeToggleBtn').onclick = () => {
        document.body.classList.toggle('dark');
    };

    // ==================== ПРОВЕРКА СЕССИИ ====================
    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session?.user) initAfterLogin(session.user);
    });

    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session?.user) {
            initAfterLogin(session.user);
        } else if (event === 'SIGNED_OUT') {
            location.reload();
        }
    });
</script>
</body>
</html>
