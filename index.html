<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://ieornhttkehqvfrllcqq.supabase.co",
  "sb_publishable_jIDA-yATtMRGuQaO0JgomA_vkOaoszh"
);

let currentUser = null;
let activeChat = null;
let chatChannel = null;

// ---------------- AUTH ----------------
supabase.auth.onAuthStateChange((_, session) => {
  if (session) {
    currentUser = session.user;
    initUser();
  }
});

window.login = async () => {
  await supabase.auth.signInWithOAuth({ provider: "google" });
};

window.logout = async () => {
  await supabase.auth.signOut();
  location.reload();
};

// ---------------- INIT USER ----------------
async function initUser() {
  document.getElementById("loginBtn").style.display = "none";
  document.getElementById("userInfo").style.display = "flex";
  document.getElementById("navName").innerText = currentUser.user_metadata.full_name;

  document.getElementById("myProfile").style.display = "block";
  document.getElementById("userName").innerText = currentUser.user_metadata.full_name;
  document.getElementById("userPhoto").src = currentUser.user_metadata.avatar_url;

  document.getElementById("postForm").style.display = "block";

  await supabase.from("profiles").upsert({
    id: currentUser.id,
    username: currentUser.user_metadata.full_name,
    photo: currentUser.user_metadata.avatar_url
  });

  loadUsers();
  loadPosts();
}

// ---------------- USERS ----------------
async function loadUsers() {
  const { data } = await supabase.from("profiles").select("*");

  const list = document.getElementById("userList");
  list.innerHTML = "";

  data.forEach(u => {
    if (u.id === currentUser.id) return;

    const div = document.createElement("div");
    div.className = "user-item";
    div.innerHTML = `
      <img src="${u.photo || ''}">
      <span>${u.username}</span>
    `;

    div.onclick = () => openChat(u);
    list.appendChild(div);
  });
}

// ---------------- CHAT ----------------
function chatId(a, b) {
  return [a, b].sort().join("_");
}

async function openChat(user) {
  activeChat = user;

  document.getElementById("chatPlaceholder").style.display = "none";
  document.getElementById("chatBox").style.display = "block";
  document.getElementById("chatHeader").innerText = "Чат с " + user.username;

  if (chatChannel) supabase.removeChannel(chatChannel);

  const id = chatId(currentUser.id, user.id);

  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("chat_id", id)
    .order("created_at");

  renderChat(data);

  chatChannel = supabase
    .channel("chat")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "messages" },
      payload => {
        if (payload.new.chat_id === id) {
          openChat(user);
        }
      }
    )
    .subscribe();
}

// ---------------- SEND MESSAGE ----------------
window.sendChat = async () => {
  const text = document.getElementById("chatInput").value;
  if (!text || !activeChat) return;

  await supabase.from("messages").insert({
    chat_id: chatId(currentUser.id, activeChat.id),
    from: currentUser.id,
    text
  });

  document.getElementById("chatInput").value = "";
};

// ---------------- POSTS ----------------
window.createPost = async () => {
  const text = document.getElementById("contentInput").value;
  const img = document.getElementById("imageUrlInput").value;

  if (!text && !img) return;

  await supabase.from("posts").insert({
    user_id: currentUser.id,
    text,
    image: img || null,
    likes: 0,
    fire: 0,
    laugh: 0,
    created_at: new Date()
  });

  document.getElementById("contentInput").value = "";
  document.getElementById("imageUrlInput").value = "";

  loadPosts();
};

// ---------------- LOAD POSTS ----------------
async function loadPosts() {
  const { data } = await supabase
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(p => {
    feed.innerHTML += `
      <div class="post">
        <div class="post-header">
          <span class="author-name">${p.user_id}</span>
          <span class="post-time">${new Date(p.created_at).toLocaleTimeString()}</span>
        </div>

        ${p.text ? `<div class="post-content">${p.text}</div>` : ""}
        ${p.image ? `<img src="${p.image}">` : ""}

        <div class="reactions">
          <button onclick="react('${p.id}','likes')">👍 ${p.likes}</button>
          <button onclick="react('${p.id}','fire')">🔥 ${p.fire}</button>
          <button onclick="react('${p.id}','laugh')">😂 ${p.laugh}</button>
        </div>
      </div>
    `;
  });
}

// ---------------- REACTIONS ----------------
window.react = async (id, type) => {
  const { data } = await supabase
    .from("posts")
    .select(type)
    .eq("id", id)
    .single();

  await supabase
    .from("posts")
    .update({ [type]: (data[type] || 0) + 1 })
    .eq("id", id);

  loadPosts();
};

// ---------------- RENDER CHAT ----------------
function renderChat(msgs) {
  const box = document.getElementById("chatMessages");
  box.innerHTML = "";

  msgs.forEach(m => {
    box.innerHTML += `
      <div class="msg ${m.from === currentUser.id ? "msg-me" : "msg-them"}">
        ${m.text}
      </div>
    `;
  });
}
</script>
