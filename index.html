<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testogram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0088cc;
            --primary-hover: #007ab8;
            --bg: #e5e5e5;
            --card: #ffffff;
            --text-main: #222222;
            --text-muted: #888888;
            --border: #d0d0d0;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        body.dark {
            --primary: #1e90ff;
            --bg: #121212;
            --card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .main-grid {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: block;
            object-fit: cover;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: rgba(0, 136, 204, 0.1);
        }

        .user-item.active {
            background: var(--primary);
            color: white;
        }

        .user-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .post-author {
            font-weight: 700;
            color: var(--primary);
        }

        .post-time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .post-content {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .post-image {
            max-width: 100%;
            border-radius: 8px;
            margin: 12px 0;
        }

        .reactions {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }

        .react-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .react-btn:hover {
            color: var(--primary);
        }

        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message-mine {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }

        .message-theirs {
            background: var(--card);
            border: 1px solid var(--border);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text-main);
            font-family: inherit;
            margin-bottom: 10px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
        }

        .switch-mode {
            text-align: center;
            margin-top: 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
        }

        .switch-mode:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <div class="logo">📱 Testogram</div>
        <div id="authSection">
            <div id="unauthButtons">
                <button id="showLoginBtn">Вход</button>
                <button id="showRegisterBtn" style="background: transparent; border: 1px solid var(--border);">Регистрация</button>
            </div>
            <div id="authUserInfo" style="display: none; align-items: center; gap: 16px;">
                <span id="userNameNav"></span>
                <button id="logoutBtn">Выйти</button>
                <button id="themeToggle">🌙</button>
            </div>
        </div>
    </div>
</div>

<div class="main-grid">
    <div>
        <div id="profileCard" class="card" style="display: none;">
            <img id="profileAvatar" class="profile-avatar" src="">
            <h3 id="profileName" style="text-align: center;"></h3>
            <p style="text-align: center; color: var(--text-muted); font-size: 12px;">Online</p>
        </div>

        <div class="card">
            <div class="card-title">💬 Собеседники</div>
            <div id="usersList">Загрузка...</div>
        </div>
    </div>

    <div>
        <div id="createPostCard" class="card" style="display: none;">
            <div class="card-title">✨ Создать пост</div>
            <input type="text" id="postText" placeholder="Что у вас нового?">
            <input type="text" id="postImage" placeholder="Ссылка на картинку (необязательно)">
            <button id="createPostBtn">Опубликовать</button>
        </div>
        <div id="feed"></div>
    </div>

    <div>
        <div id="chatCard" class="card" style="display: none;">
            <div class="card-title" id="chatTitle">Чат</div>
            <div id="chatMessages" class="chat-messages"></div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="chatInput" placeholder="Сообщение...">
                <button id="sendMessageBtn" style="width: auto; padding: 12px;">📤</button>
            </div>
        </div>
        <div id="noChatCard" class="card" style="text-align: center; color: var(--text-muted);">
            👈 Выберите собеседника слева, чтобы начать чат
        </div>
    </div>
</div>

<!-- Модалка входа/регистрации -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Вход</h2>
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPassword" placeholder="Пароль (минимум 6 символов)">
        <div id="authError" class="error"></div>
        <button id="submitAuthBtn" style="width: 100%;">Войти</button>
        <div id="switchMode" class="switch-mode">Нет аккаунта? Зарегистрироваться</div>
        <button id="closeModalBtn" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--border);">Отмена</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ========== SUPABASE ==========
    const supabaseUrl = "https://ieornhttkehqvfrllcqq.supabase.co";
    const supabaseKey = "sb_publishable_jIDA-yATtMRGuQaO0JgomA_vkOaoszh";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // ========== ПЕРЕМЕННЫЕ ==========
    let currentUser = null;
    let currentChatUser = null;
    let messagesSubscription = null;
    let isLoginMode = true;

    // ========== МОДАЛКА ==========
    const modal = document.getElementById('authModal');
    
    document.getElementById('showLoginBtn').onclick = () => {
        isLoginMode = true;
        document.getElementById('modalTitle').innerText = 'Вход';
        document.getElementById('submitAuthBtn').innerText = 'Войти';
        document.getElementById('switchMode').innerHTML = 'Нет аккаунта? Зарегистрироваться';
        modal.style.display = 'flex';
    };

    document.getElementById('showRegisterBtn').onclick = () => {
        isLoginMode = false;
        document.getElementById('modalTitle').innerText = 'Регистрация';
        document.getElementById('submitAuthBtn').innerText = 'Зарегистрироваться';
        document.getElementById('switchMode').innerHTML = 'Уже есть аккаунт? Войти';
        modal.style.display = 'flex';
    };

    document.getElementById('switchMode').onclick = () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            document.getElementById('modalTitle').innerText = 'Вход';
            document.getElementById('submitAuthBtn').innerText = 'Войти';
            document.getElementById('switchMode').innerHTML = 'Нет аккаунта? Зарегистрироваться';
        } else {
            document.getElementById('modalTitle').innerText = 'Регистрация';
            document.getElementById('submitAuthBtn').innerText = 'Зарегистрироваться';
            document.getElementById('switchMode').innerHTML = 'Уже есть аккаунт? Войти';
        }
        document.getElementById('authError').innerText = '';
    };

    document.getElementById('closeModalBtn').onclick = () => {
        modal.style.display = 'none';
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
        document.getElementById('authError').innerText = '';
    };

    document.getElementById('submitAuthBtn').onclick = async () => {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const errorDiv = document.getElementById('authError');

        if (!email || !password) {
            errorDiv.innerText = 'Заполните все поля';
            return;
        }

        if (!isLoginMode && password.length < 6) {
            errorDiv.innerText = 'Пароль должен быть минимум 6 символов';
            return;
        }

        try {
            let result;
            if (isLoginMode) {
                result = await supabase.auth.signInWithPassword({ email, password });
            } else {
                result = await supabase.auth.signUp({ email, password });
            }

            if (result.error) throw result.error;

            if (!isLoginMode) {
                errorDiv.style.color = '#27ae60';
                errorDiv.innerText = '✅ Регистрация успешна! Теперь войдите.';
                setTimeout(() => {
                    isLoginMode = true;
                    document.getElementById('modalTitle').innerText = 'Вход';
                    document.getElementById('submitAuthBtn').innerText = 'Войти';
                    document.getElementById('switchMode').innerHTML = 'Нет аккаунта? Зарегистрироваться';
                    errorDiv.innerText = '';
                }, 2000);
            } else {
                modal.style.display = 'none';
                document.getElementById('authEmail').value = '';
                document.getElementById('authPassword').value = '';
            }
        } catch (error) {
            errorDiv.style.color = '#e74c3c';
            errorDiv.innerText = error.message;
        }
    };

    document.getElementById('logoutBtn').onclick = async () => {
        await supabase.auth.signOut();
        location.reload();
    };

    // ========== ОСНОВНАЯ ЛОГИКА ==========
    async function onUserLoggedIn(user) {
        currentUser = user;
        
        const userName = user.email.split('@')[0];
        const userAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email}`;
        
        await supabase.from('users').upsert({
            uid: user.id,
            name: userName,
            email: user.email,
            photo: userAvatar
        });

        document.getElementById('unauthButtons').style.display = 'none';
        document.getElementById('authUserInfo').style.display = 'flex';
        document.getElementById('userNameNav').innerText = userName;
        document.getElementById('profileCard').style.display = 'block';
        document.getElementById('createPostCard').style.display = 'block';
        
        document.getElementById('profileName').innerText = userName;
        document.getElementById('profileAvatar').src = userAvatar;

        await loadUsers();
        await loadPosts();
        subscribeToPosts();
    }

    async function loadUsers() {
        const { data: users, error } = await supabase
            .from('users')
            .select('*')
            .neq('uid', currentUser?.id);

        if (error) {
            console.error(error);
            return;
        }

        const container = document.getElementById('usersList');
        
        if (!users || users.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">🤝 Нет других пользователей</div>';
            return;
        }

        container.innerHTML = '';
        users.forEach(user => {
            const userDiv = document.createElement('div');
            userDiv.className = 'user-item';
            if (currentChatUser?.uid === user.uid) userDiv.classList.add('active');
            userDiv.innerHTML = `
                <img class="user-avatar-small" src="${user.photo || 'https://via.placeholder.com/40'}">
                <span>${user.name}</span>
            `;
            userDiv.onclick = () => startChat(user);
            container.appendChild(userDiv);
        });
    }

    async function startChat(user) {
        currentChatUser = user;
        
        document.getElementById('noChatCard').style.display = 'none';
        document.getElementById('chatCard').style.display = 'block';
        document.getElementById('chatTitle').innerHTML = `💬 Чат с ${user.name}`;
        
        if (messagesSubscription) {
            messagesSubscription.unsubscribe();
        }
        
        const chatId = [currentUser.id, user.uid].sort().join('_');
        
        messagesSubscription = supabase
            .channel(`chat_${chatId}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `chat_id=eq.${chatId}`
            }, (payload) => {
                addMessageToChat(payload.new);
            })
            .subscribe();
        
        const { data: messages, error } = await supabase
            .from('messages')
            .select('*')
            .eq('chat_id', chatId)
            .order('timestamp', { ascending: true });
        
        if (!error) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            messages?.forEach(msg => addMessageToChat(msg));
        }
        
        loadUsers();
    }

    function addMessageToChat(message) {
        const container = document.getElementById('chatMessages');
        const isMine = message.from_uid === currentUser.id;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isMine ? 'message-mine' : 'message-theirs'}`;
        messageDiv.textContent = message.text;
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('sendMessageBtn').onclick = async () => {
        if (!currentChatUser) return;
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        
        const chatId = [currentUser.id, currentChatUser.uid].sort().join('_');
        
        await supabase.from('messages').insert({
            chat_id: chatId,
            from_uid: currentUser.id,
            from_name: currentUser.email.split('@')[0],
            text: text,
            timestamp: new Date().toISOString()
        });
        
        input.value = '';
    };

    async function loadPosts() {
        const { data: posts, error } = await supabase
            .from('posts')
            .select('*')
            .order('timestamp', { ascending: false });
        
        if (error) {
            console.error(error);
            return;
        }
        
        renderPosts(posts || []);
    }
    
    function renderPosts(posts) {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        
        posts.forEach(post => {
            const postDiv = document.createElement('div');
            postDiv.className = 'post';
            postDiv.innerHTML = `
                <div class="post-header">
                    <span class="post-author">${escapeHtml(post.name)}</span>
                    <span class="post-time">${new Date(post.timestamp).toLocaleString()}</span>
                </div>
                ${post.text ? `<div class="post-content">${escapeHtml(post.text)}</div>` : ''}
                ${post.image_url ? `<img class="post-image" src="${post.image_url}" onerror="this.style.display='none'">` : ''}
                <div class="reactions">
                    <button class="react-btn" onclick="window.addReaction('${post.id}', 'like')">👍 ${post.reactions?.like || 0}</button>
                    <button class="react-btn" onclick="window.addReaction('${post.id}', 'fire')">🔥 ${post.reactions?.fire || 0}</button>
                    <button class="react-btn" onclick="window.addReaction('${post.id}', 'laugh')">😂 ${post.reactions?.laugh || 0}</button>
                </div>
            `;
            feed.appendChild(postDiv);
        });
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    window.addReaction = async (postId, reactionType) => {
        const { data: post } = await supabase
            .from('posts')
            .select('reactions')
            .eq('id', postId)
            .single();
        
        if (post) {
            const newReactions = { ...(post.reactions || {}) };
            newReactions[reactionType] = (newReactions[reactionType] || 0) + 1;
            
            await supabase
                .from('posts')
                .update({ reactions: newReactions })
                .eq('id', postId);
        }
    };
    
    function subscribeToPosts() {
        supabase
            .channel('posts_channel')
            .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'posts'
            }, () => {
                loadPosts();
            })
            .subscribe();
    }
    
    document.getElementById('createPostBtn').onclick = async () => {
        const text = document.getElementById('postText').value;
        const imageUrl = document.getElementById('postImage').value;
        
        if (!text && !imageUrl) {
            alert('Напишите текст или добавьте картинку');
            return;
        }
        
        await supabase.from('posts').insert({
            name: currentUser.email.split('@')[0],
            user_id: currentUser.id,
            text: text || '',
            image_url: imageUrl || '',
            timestamp: new Date().toISOString(),
            reactions: { like: 0, fire: 0, laugh: 0 }
        });
        
        document.getElementById('postText').value = '';
        document.getElementById('postImage').value = '';
    };

    // ========== ТЕМНАЯ ТЕМА ==========
    document.getElementById('themeToggle').onclick = () => {
        document.body.classList.toggle('dark');
    };

    // ========== ЗАПУСК ==========
    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session?.user) {
            onUserLoggedIn(session.user);
        }
    });

    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session?.user) {
            onUserLoggedIn(session.user);
        } else if (event === 'SIGNED_OUT') {
            location.reload();
        }
    });
</script>
</body>
</html>
